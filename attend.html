<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참석 신청</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:#f1f5f9;min-height:100vh">

<!-- 헤더 -->
<div style="background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:white;padding:28px 20px;text-align:center">
  <div style="font-size:2rem;margin-bottom:8px">📅</div>
  <h1 id="attend-title" style="font-size:1.25rem;font-weight:700">로딩 중...</h1>
  <p id="attend-meta" style="font-size:.85rem;opacity:.85;margin-top:6px"></p>
</div>

<!-- 폼 영역 -->
<div style="max-width:480px;margin:0 auto;padding:24px 16px 48px">
  <div id="attend-wrap" style="background:white;border-radius:16px;padding:28px 22px;box-shadow:0 2px 16px rgba(0,0,0,.09)">
    <div class="empty-state"><div class="icon">⏳</div><p>로딩 중...</p></div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
// =====================================================
// Firestore REST API 설정 (Firebase SDK 없이 동작)
// =====================================================
const PROJECT_ID = 'event-app-660e5';
const API_KEY    = 'AIzaSyDYqBT-O2OuditfSHzz8T0CqRR4yWLMxw8';
const FS_BASE    = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

// Firestore 문서 필드 파싱
function parseField(f) {
  if (!f) return null;
  if ('stringValue'    in f) return f.stringValue;
  if ('integerValue'   in f) return parseInt(f.integerValue);
  if ('doubleValue'    in f) return parseFloat(f.doubleValue);
  if ('booleanValue'   in f) return f.booleanValue;
  if ('timestampValue' in f) return f.timestampValue;
  if ('arrayValue'     in f) return (f.arrayValue.values || []).map(parseField);
  if ('mapValue'       in f) return parseFields(f.mapValue.fields || {});
  return null;
}
function parseFields(fields) {
  const obj = {};
  for (const [k, v] of Object.entries(fields || {})) obj[k] = parseField(v);
  return obj;
}

// JS 값 → Firestore 필드
function toField(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'string')  return { stringValue: v };
  if (typeof v === 'number')  return Number.isInteger(v) ? { integerValue: v } : { doubleValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  return { stringValue: String(v) };
}

// 이벤트 조회
async function fetchEvent(eventId) {
  const res = await fetch(`${FS_BASE}/events/${eventId}?key=${API_KEY}`);
  if (res.status === 404) throw new Error('이벤트를 찾을 수 없습니다.');
  if (!res.ok) throw new Error('이벤트 로드 실패 (' + res.status + ')');
  const doc = await res.json();
  return { id: eventId, ...parseFields(doc.fields) };
}

// 참가자 추가
async function submitParticipant(eventId, data) {
  const fields = {};
  for (const [k, v] of Object.entries(data)) {
    const f = toField(v);
    if (f !== null) fields[k] = f;
  }
  fields.createdAt = { timestampValue: new Date().toISOString() };

  const res = await fetch(
    `${FS_BASE}/events/${eventId}/participants?key=${API_KEY}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields }),
    }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || '신청에 실패했습니다.');
  }
}

// =====================================================
// 유틸
// =====================================================
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function setBtnLoading(id, loading) {
  const btn = document.getElementById(id);
  if (!btn) return;
  if (loading) {
    btn._orig = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
  } else {
    btn.innerHTML = btn._orig || '신청';
    btn.disabled = false;
  }
}

// =====================================================
// 초기화
// =====================================================
const eventId = new URLSearchParams(location.search).get('event');

async function init() {
  if (!eventId) { showError('URL에 이벤트 ID가 없습니다.'); return; }
  try {
    const ev = await fetchEvent(eventId);
    renderForm(ev);
  } catch (e) {
    showError(e.message);
  }
}

function showError(msg) {
  document.getElementById('attend-title').textContent = '오류';
  document.getElementById('attend-wrap').innerHTML =
    `<p style="text-align:center;color:#ef4444;padding:40px 0">${esc(msg)}</p>`;
}

// =====================================================
// 폼 렌더
// =====================================================
function renderForm(ev) {
  document.title = `참석 신청 — ${ev.title}`;
  document.getElementById('attend-title').textContent = ev.title;
  const meta = [ev.eventDate, ev.location, ev.organizer].filter(Boolean).join(' · ');
  document.getElementById('attend-meta').textContent = meta;

  const opts = ev.attendOptions && ev.attendOptions.length
    ? ev.attendOptions
    : ['운동', '운동+회식', '회식'];

  const optHTML = opts.map(o => `
    <label class="attend-option-label">
      <input type="radio" name="attend-type" value="${esc(o)}">
      <span>${esc(o)}</span>
    </label>`).join('');

  document.getElementById('attend-wrap').innerHTML = `
    <h2 style="font-size:1rem;font-weight:700;color:#1e293b;margin-bottom:20px">참석 신청</h2>

    <div class="form-group">
      <label class="form-label">이름 <span class="required">*</span></label>
      <input id="att-name" class="form-input" type="text" placeholder="홍길동">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">성별</label>
        <select id="att-gender" class="form-select">
          <option value="">선택</option>
          <option value="남">남</option>
          <option value="여">여</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">급수</label>
        <input id="att-grade" class="form-input" type="text" placeholder="A, B, C">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">나이</label>
        <input id="att-age" class="form-input" type="number" placeholder="35" min="1" max="120">
      </div>
      <div class="form-group">
        <label class="form-label">경력 (년)</label>
        <input id="att-career" class="form-input" type="number" placeholder="3" min="0">
      </div>
    </div>

    <div class="form-group" style="margin-top:4px">
      <label class="form-label">참석 구분 <span class="required">*</span></label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        ${optHTML}
      </div>
    </div>

    <button id="btn-submit" class="btn btn-primary"
      style="width:100%;justify-content:center;padding:12px;font-size:.95rem;margin-top:20px"
      onclick="handleSubmit()">참석 신청하기</button>
  `;
}

// =====================================================
// 제출
// =====================================================
async function handleSubmit() {
  const name       = document.getElementById('att-name').value.trim();
  const attendType = document.querySelector('input[name="attend-type"]:checked')?.value;

  if (!name)       { showToast('이름을 입력하세요.', 'error'); return; }
  if (!attendType) { showToast('참석 구분을 선택하세요.', 'error'); return; }

  const data = {
    name,
    gender:     document.getElementById('att-gender').value,
    grade:      document.getElementById('att-grade').value.trim(),
    age:        Number(document.getElementById('att-age').value) || '',
    career:     Number(document.getElementById('att-career').value) || '',
    attendType,
  };

  setBtnLoading('btn-submit', true);
  try {
    await submitParticipant(eventId, data);
    document.getElementById('attend-wrap').innerHTML = `
      <div style="text-align:center;padding:40px 0">
        <div style="font-size:3rem;margin-bottom:14px">✅</div>
        <p style="font-size:1.1rem;font-weight:700;color:#1e293b">참석 신청 완료!</p>
        <p style="color:#64748b;font-size:.875rem;margin-top:8px">${esc(name)}님의 신청이 등록되었습니다.</p>
        <p style="color:#94a3b8;font-size:.8rem;margin-top:4px">${esc(attendType)}</p>
        <button class="btn btn-outline" style="margin-top:24px" onclick="location.reload()">다시 신청하기</button>
      </div>`;
  } catch (e) {
    showToast(e.message, 'error');
    setBtnLoading('btn-submit', false);
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
